# a small server configuration
listen 8080;
workers 4;

server {
    name "example.com";
    root /var/www/example;

    location /api {
        proxy_pass http://127.0.0.1:9000;
        timeout 30;
    }

    location /static {
        root /var/www/example/static;
        cache 1d;
    }
}

server {
    name "internal.example.com";
    root /var/www/internal;
}
