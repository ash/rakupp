name: build & release

# Builds rakupp on every target platform and, when a v* tag is pushed,
# attaches the packaged binaries to a GitHub Release.
#   - macOS   : universal binary (arm64 + x86_64), Apple Clang
#   - Linux   : x86_64, GCC, statically linked libstdc++/libgcc for portability
#   - Windows : x64, native MSVC
#   - OpenBSD : x86_64, base clang/libc++ (packaged by the openbsd job below)
# The `wasm` job additionally attaches the Raku.js WebAssembly build (playground
# bundle + ready-to-open browser showcases) so users don't need Emscripten.
# On push/PR to main it just builds + smoke-tests (no release), so portability
# regressions surface immediately.

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the Release on a tag

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macos-universal }
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: windows-latest, name: windows-x64-mingw, mingw: true }
    steps:
      - uses: actions/checkout@v7

      # Deployment target 11.0 = Big Sur, the first Apple Silicon macOS: the
      # artifact runs on any Mac from 2020 on, regardless of which macOS the
      # runner image happens to be (macos-latest rotates, e.g. to macOS 26 —
      # without this pin the binary's minimum OS would silently drift up).
      # -DRAKUPP_BUILD_SHARED=ON on every platform: the release has to CARRY
      # librakupp, or the embedding API (docs/guide/EMBEDDING.md) exists only
      # for people who build from source, and no language binding has anything
      # to dlopen. It is off by default because it recompiles every runtime
      # source with PIC and hidden visibility -- roughly doubling a build -- and
      # a local edit-compile loop never needs it. `cmake --install` then picks
      # it up on its own, so the packaging step below is unchanged.
      #
      # Built on every push rather than only on tags, deliberately: a shared
      # build that breaks would otherwise stay hidden until the tag, which is
      # the shape of failure v3.0.0 shipped.
      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAKUPP_BUILD_SHARED=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      # Clang, not GCC: on rakupp's tree-walker Clang -O3 measures 1.2-2.0x
      # faster than GCC across the whole bench suite (fib +28%, loopsum +46%;
      # measured on arm64 with Clang 17 vs GCC 16.1, LTO/-mcpu=native change
      # nothing). GCC portability is still guarded by a local GCC build.
      - name: Configure (Linux, Clang, static libstdc++)
        if: runner.os == 'Linux'
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAKUPP_BUILD_SHARED=ON "-DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++"

      # No pinned -G: windows-latest rotates its Visual Studio version (2022 is
      # already gone); CMake's default generator picks whatever VS is installed.
      # MultiThreaded = static CRT (/MT): the exe carries its own C++ runtime,
      # so users don't need the VC++ Redistributable (msvcp140.dll) installed —
      # same self-contained philosophy as the static libstdc++ on Linux.
      - name: Configure (Windows, MSVC x64)
        if: runner.os == 'Windows' && matrix.mingw != true
        run: cmake -S . -B build -A x64 -DRAKUPP_BUILD_SHARED=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      # MinGW-w64 (GCC) Windows build — the GNU toolchain MSYS2 users have,
      # and what `--exe` invokes there (g++ on PATH). -static bundles
      # libstdc++/libgcc/winpthread so the exe is as self-contained as the
      # /MT MSVC build. The runtime archive is librakupp_rt.a here (the
      # --exe lookup accepts both namings).
      - name: Set up MSYS2 (MinGW-w64)
        if: matrix.mingw == true
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make

      - name: Configure (Windows, MinGW-w64)
        if: matrix.mingw == true
        shell: msys2 {0}
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DRAKUPP_BUILD_SHARED=ON "-DCMAKE_EXE_LINKER_FLAGS=-static"

      - name: Build
        if: matrix.mingw != true
        run: cmake --build build --config Release -j 4

      - name: Build (MinGW-w64)
        if: matrix.mingw == true
        shell: msys2 {0}
        run: cmake --build build -j 4

      - name: Smoke test (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp tools/smoke.raku

      - name: Smoke test (Windows)
        if: runner.os == 'Windows' && matrix.mingw != true
        run: build\Release\rakupp.exe tools/smoke.raku

      - name: Smoke test (Windows, MinGW-w64)
        if: matrix.mingw == true
        shell: msys2 {0}
        run: build/rakupp.exe tools/smoke.raku

      # -e one-liners, OUTPUT-verified (exit codes alone would miss swallowed
      # stdout — a user report had `-e` printing nothing on Windows).
      - name: Smoke test -e (POSIX)
        if: runner.os != 'Windows'
        run: |
          out=$(build/rakupp -e 'say 6 * 7')
          echo "got: [$out]"
          test "$out" = "42"

      - name: Smoke test -e (Windows)
        if: runner.os == 'Windows' && matrix.mingw != true
        shell: pwsh
        run: |
          $out = build\Release\rakupp.exe -e "say 6 * 7" | Out-String
          Write-Host "got: [$out]"
          if ($out.Trim() -ne "42") { exit 1 }

      - name: Smoke test -e (Windows, cmd)
        if: runner.os == 'Windows' && matrix.mingw != true
        shell: cmd
        run: |
          build\Release\rakupp.exe -e "say 6 * 7" > out.txt
          type out.txt
          findstr /x 42 out.txt

      - name: Smoke test -e (Windows, MinGW-w64)
        if: matrix.mingw == true
        shell: msys2 {0}
        run: |
          out=$(build/rakupp.exe -e 'say 6 * 7')
          echo "got: [$out]"
          test "$out" = "42"

      # --exe end-to-end: compile the (self-checking) smoke test to a native
      # binary with the platform's own C++ toolchain, then run it. Exercises
      # the runtime-library lookup, the compile-driver dialect, and the
      # linked product on every platform (github issue #1).
      - name: Smoke test --exe (POSIX)
        if: runner.os != 'Windows'
        run: |
          build/rakupp --exe tools/smoke.raku -o smoke-native
          ./smoke-native

      - name: MSVC compiler environment (for --exe)
        if: runner.os == 'Windows' && matrix.mingw != true
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Smoke test --exe (Windows, MSVC)
        if: runner.os == 'Windows' && matrix.mingw != true
        shell: pwsh
        run: |
          build\Release\rakupp.exe --exe tools/smoke.raku -o smoke-native.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\smoke-native.exe
          $code = $LASTEXITCODE
          # surface the REAL exit code: 0xC0000005 access violation,
          # 0xC00000FD stack overflow, 3 abort — the number names the bug
          Write-Host ("native exit code: {0} (0x{0:X8})" -f $code)
          if ($code -ne 0) { exit 1 }

      - name: Smoke test --exe (Windows, MinGW-w64)
        if: matrix.mingw == true
        shell: msys2 {0}
        env:
          CXX: g++
        run: |
          build/rakupp.exe --exe tools/smoke.raku -o smoke-native.exe
          set +e
          ./smoke-native.exe
          code=$?
          set -e
          echo "native exit code: $code"
          exit $code

      # Byte-for-byte checks of every example + showcase against t/expected/,
      # plus live pastebin/chat servers. POSIX only: the server tests background
      # a process through the shell and stop it with pkill. The goldens are
      # arch-portable (exact int/Rat, IEEE basic ops, correctly-rounded sqrt).
      - name: Example & showcase suite (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp t/run.raku

      # The concurrency stress matrix, native build: BOTH modes enforced with
      # the known-bad ratchet (the TSan leg lives in the linux-tsan job).
      - name: Concurrency stress matrix (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp t/stress/run.raku

      # The embed/ABI gate (ABI-PLAN A0-A2): compiles a C++ host and a C
      # extension against the headers, loads the extension, and checks
      # librakupp's export table against rakupp_ext.h + rakupp.h.
      #
      # This is the step that proves the LINUX extension story, which cannot be
      # checked on macOS at all: a plain ELF executable keeps its symbols out of
      # .dynsym, so until the --dynamic-list link option landed, an extension's
      # first rk_* call died with an undefined symbol -- extensions had never
      # actually worked on Linux, and a well-written module falls back quietly
      # enough that nobody saw an error.
      - name: Embed + extension ABI gate (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp tools/embed-smoke.raku build

      # The grammar-service gate (GRAMMAR-PLAN G0-G2): the Raku shim's own
      # contract under plain rakupp, then every host binding the runner can
      # drive — Python (ctypes), C++ (grammar.hpp), JS (bun:ffi),
      # Go (cgo), Rust (crate) — each against the same grammar and corpus as
      # the Raku reference driver, byte-compared. Legs self-skip when their
      # toolchain is absent; bun is installed here because the runners lack
      # it while go/cargo/python3/c++ are preinstalled.
      - name: Install bun (for the JS binding leg)
        if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
      - name: Grammar service gate (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp tools/grammar-smoke.raku build

      # The bindings gate: every example named by a bindings/examples/*.raku,
      # run in every language the runner has (each language's own program
      # lives in bindings/<lang>/examples/), and each output compared against
      # the recorded expectation in bindings/examples/expected/. This is what
      # keeps the outputs printed in the binding guides honest -- a guide that
      # says "you should see this" is checked here, not trusted.
      - name: Bindings example gate (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp tools/bindings-smoke.raku build

      # The MCP gate: `rakupp --mcp` driven exactly as an MCP client drives
      # it -- the initialize handshake, both tools, session state across
      # calls, the parse tree and failure diagnosis, and the watchdog's
      # answer-then-exit contract for a call that cannot be interrupted.
      - name: MCP server gate (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp tools/mcp-smoke.raku build

      # The SLIM negative suite (SLIM-PLAN P3+P4): --slim's grammar,
      # X::Feature::NotBuilt from every cut feature, the --exe-info manifest
      # round-trip, the size budgets, and the P4 scan's decisions (cut the
      # provably-unused, keep the used, keep-all on a trigger). Compiles ~17
      # binaries, so like the embed smoke it needs the toolchain — POSIX
      # runners have one on PATH; the Windows compile flow is covered by the
      # --exe step above. The full behaviour differential
      # (tools/slim-diff.raku) is a release gate, not a CI step — it builds
      # the whole corpus twice.
      - name: SLIM negative suite (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp t/slim/run.raku

      # The standalone-binary gate (MODULES-PLAN B1/B2/B4/B5): binaries that
      # claim to carry their modules RUN with the store hidden; unembeddable
      # modules are loud (and fatal under --standalone); native libraries are
      # named. Compiles binaries, so POSIX-only like the slim suite.
      - name: Standalone binary gate (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp t/standalone/run.raku

      # The installer gate (MODULES-PLAN M1-M5): `rakupp install` against a
      # LOCAL fixture index and archive — resolution, checksum refusal, a
      # real store write the engine then loads from, the per-dist test gate.
      # No network: the fixture stands in for the ecosystem.
      - name: Installer gate (POSIX)
        if: runner.os != 'Windows'
        run: build/rakupp t/install/run.raku

      # Package the --exe-capable install layout: bin/rakupp, the archive set in
      # lib/ (librakupp_rt.a plus ucd_names/ucd_coll/ucd_props/parse, and the
      # rakupp_stubs archive --slim links in place of a cut feature — the SLIM
      # split; findRuntime() locates the set and errors on a missing member),
      # and include/rakupp/*.h.
      - name: Install layout
        if: matrix.mingw != true
        run: cmake --install build --config Release --prefix dist/rakupp

      - name: Install layout (MinGW-w64)
        if: matrix.mingw == true
        shell: msys2 {0}
        run: cmake --install build --prefix dist/rakupp

      # --exe FROM THE INSTALLED LAYOUT (bin/ + lib/ + include/) — the shape
      # users actually download; the build-tree smoke above has the library
      # beside the binary and cannot catch dist-layout lookup bugs.
      - name: Smoke test --exe from install layout (POSIX)
        if: runner.os != 'Windows'
        run: |
          dist/rakupp/bin/rakupp --exe -e 'say 6 * 7' -o dist-native
          out=$(./dist-native)
          echo "got: [$out]"
          test "$out" = "42"

      - name: Smoke test --exe from install layout (Windows, MSVC)
        if: runner.os == 'Windows' && matrix.mingw != true
        shell: pwsh
        run: |
          dist\rakupp\bin\rakupp.exe --exe -e "say 6 * 7" -o dist-native.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = .\dist-native.exe | Out-String
          Write-Host "got: [$out]"
          if ($out.Trim() -ne "42") { exit 1 }

      - name: Smoke test --exe from install layout (Windows, MinGW-w64)
        if: matrix.mingw == true
        shell: msys2 {0}
        env:
          CXX: g++
        run: |
          dist/rakupp/bin/rakupp.exe --exe -e 'say 6 * 7' -o dist-native.exe
          out=$(./dist-native.exe)
          echo "got: [$out]"
          test "$out" = "42"

      # The Python platform wheel: bindings/python with librakupp bundled
      # inside, so `pip install <wheel>` works on a machine with no rakupp at
      # all (macOS wheel carries the universal library). Publishing to PyPI
      # is a manual decision; the wheel ships as a release asset either way.
      - name: Python wheel (bundled librakupp)
        if: runner.os != 'Windows'
        run: sh tools/build-wheel.sh build dist-wheel && cp dist-wheel/rakulang-*.whl .

      - name: Package (POSIX)
        if: runner.os != 'Windows'
        run: |
          cp README.md LICENSE dist/rakupp/ 2>/dev/null || true
          tar -C dist -czf rakupp-${{ matrix.name }}.tar.gz rakupp
          if command -v shasum >/dev/null; then
            shasum -a 256 rakupp-${{ matrix.name }}.tar.gz > rakupp-${{ matrix.name }}.tar.gz.sha256
          else
            sha256sum rakupp-${{ matrix.name }}.tar.gz > rakupp-${{ matrix.name }}.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE dist\rakupp\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\rakupp\* -DestinationPath rakupp-${{ matrix.name }}.zip
          (Get-FileHash rakupp-${{ matrix.name }}.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii rakupp-${{ matrix.name }}.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rakupp-${{ matrix.name }}
          path: |
            rakupp-${{ matrix.name }}.*
            rakulang-*.whl
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rakupp-${{ matrix.name }}.*
            rakulang-*.whl

  # Raku.js: the interpreter compiled to WebAssembly (rakujs/build.sh). Ships two
  # release assets so users don't need Emscripten:
  #   - rakujs-<tag>.zip        the reusable build + playground (embed anywhere)
  #   - showcase-web-<tag>.zip  the browser showcase apps with the wasm already
  #                             embedded — unzip and open index.html (no server)
  # Tag-only (+ manual dispatch): the em++ -Oz compile costs a few minutes, so
  # ordinary pushes don't pay it.
  wasm:
    name: wasm (Raku.js)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      # Native rakupp — build.sh runs it (gen-examples.raku) to regenerate the
      # playground's examples.js from examples/*.raku.
      - name: Build native rakupp (for examples.js)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      # Cached toolchain, so no ~1 GB emsdk bootstrap that build.sh does locally.
      # 'latest' mirrors build.sh's own `emsdk install latest`.
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build Raku.js (WebAssembly)
        run: rakujs/build.sh

      # The wasm build is single-threaded, so anything the engine hands to a
      # thread fails there and only there — the grammar memo reaper did, and
      # every native gate stayed green while the playground aborted on every
      # non-trivial parse. A second build (same flags, `node` added to
      # -sENVIRONMENT so Node can load the glue) runs the showcase interpreters
      # the playground ships. The shipped pair above stays browser-only.
      - name: Smoke-test Raku.js under Node
        run: |
          RAKUJS_ENV=node,web,worker RAKUJS_OUT=/tmp/rakujs-node rakujs/build.sh
          node --stack-size=6000 rakujs/smoke.cjs /tmp/rakujs-node

      # The built pair is what raku.online's playground ships (www/rakujs.js +
      # rakujs.wasm). Uploading it lets the site-republish step of a release
      # `gh run download -n rakujs-wasm` instead of installing emscripten and
      # rebuilding locally — which is exactly what the v3.14.0 republish had
      # to do when this job built the pair and then threw it away. The name
      # stays stable; scripts depend on it.
      - name: Upload the engine pair
        uses: actions/upload-artifact@v4
        with:
          name: rakujs-wasm
          path: |
            rakujs/playground/rakujs.js
            rakujs/playground/rakujs.wasm
          if-no-files-found: error

      # Embed the wasm as base64 + inline the showcase sources into showcase/web/lib/,
      # so the apps in that folder open straight from disk.
      - name: Bundle the browser showcases
        run: showcase/web/bundle.sh

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          # 1) reusable Raku.js build + playground (drop into a site's /playground/)
          ( cd rakujs/playground &&
            zip -q -X "$GITHUB_WORKSPACE/rakujs-$tag.zip" \
                index.html worker.js rakujs.js rakujs.wasm examples.js )
          # 2) ready-to-open showcase apps: wasm already embedded in web/lib/
          zip -q -X -r "rakujs-showcase-web-$tag.zip" showcase/web \
              -x 'showcase/web/.gitignore' '*.DS_Store'
          for f in "rakujs-$tag.zip" "rakujs-showcase-web-$tag.zip"; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -lh rakujs-*.zip*

      # A DIFFERENT name from the engine pair above. Both steps uploaded
      # `rakujs-wasm` while upload-artifact was v4 either side, which merged
      # them; v7 refuses (409 Conflict, "an artifact with this name already
      # exists on the workflow run") and took the whole job down with the
      # release zips already built. The engine pair keeps the stable name
      # because the site-republish path downloads it by that name.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rakujs-release-zips
          path: rakujs-*.zip*
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: rakujs-*.zip*

  # The Linux release binary above is built with Clang (faster); this job keeps
  # GCC compiling cleanly too — it's what most Linux users' `cmake --build` uses.
  gcc-portability:
    name: linux-gcc (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Shared too: the release now SHIPS librakupp, and hidden visibility plus
      # the dynamic-list are the parts most likely to differ between compilers.
      # Clang builds the artifact; this is what stops GCC from silently drifting.
      - name: Configure (GCC)
        env: { CC: gcc, CXX: g++ }
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAKUPP_BUILD_SHARED=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Smoke test
        run: build/rakupp tools/smoke.raku

  # The concurrency gate (v3 parallelism campaign, phase P1): a
  # ThreadSanitizer build running the t/stress/ matrix in both modes.
  # Races are invisible without this job — a racy build can pass every
  # functional test for months. The runner's known-bad list is the
  # campaign's visible backlog: a NEW failure (including a TSan-detected
  # race, surfaced via exitcode=66) fails this job; a known-bad entry that
  # starts passing fails it too, so the list can only shrink honestly.
  linux-tsan:
    name: linux-tsan (concurrency stress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure (Clang + ThreadSanitizer)
        env: { CC: clang, CXX: clang++ }
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        run: cmake --build build -j 4
      - name: Stress matrix (GIL strict; parallel = P2 backlog under TSan)
        env:
          TSAN_OPTIONS: exitcode=66
          RAKUPP_STRESS_TSAN: 1
        run: build/rakupp t/stress/run.raku

  # OpenBSD target. GitHub has no native BSD runner, so vmactions boots a real
  # OpenBSD guest under QEMU inside the Ubuntu runner and runs the build in it.
  # OpenBSD's base `c++` is clang + libc++ (no libstdc++), so no static
  # portability flags here. The one non-obvious trap: OpenBSD's default login-
  # class `datasize` limit is low enough that an -O3 C++ compile can be killed
  # for exhausting memory — `ulimit -d` lifts it before configuring.
  #
  # This job also PACKAGES the build (amd64 install layout) so OpenBSD is a
  # downloadable release asset like the other platforms. The tarball is produced
  # inside the guest, then copied back to the host workspace (vmactions copyback)
  # for upload / release attachment on tags.
  openbsd:
    name: openbsd (build + smoke + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build & test on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          # cmake + gmake: CMake's Unix Makefiles generator needs GNU make on
          # BSD; `cmake --build` then drives gmake. clang/clang++ are in base.
          prepare: |
            pkg_add -I cmake gmake
          run: |
            set -e
            ulimit -d 2097152 || true   # raise datasize so the compile isn't OOM-killed
            cc --version
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j 2
            build/rakupp tools/smoke.raku
            out=$(build/rakupp -e 'say 6 * 7')
            echo "got: [$out]"
            test "$out" = "42"
            # --exe end-to-end: compiles generated C++ with the base clang toolchain
            build/rakupp --exe tools/smoke.raku -o smoke-native
            ./smoke-native
            # Package the --exe-capable install layout (bin/ + lib/ + include/).
            cmake --install build --prefix dist/rakupp
            # --exe FROM THE INSTALLED LAYOUT — the shape users download.
            dist/rakupp/bin/rakupp --exe -e 'say 6 * 7' -o dist-native
            test "$(./dist-native)" = "42"
            cp README.md LICENSE dist/rakupp/ 2>/dev/null || true
            pkg=rakupp-openbsd-x86_64.tar.gz
            tar -C dist -czf "$pkg" rakupp
            # OpenBSD base `sha256 -q` prints the bare hash; format it as
            # "<hash>  <file>" to match the coreutils-style .sha256 sidecars.
            printf '%s  %s\n' "$(sha256 -q "$pkg")" "$pkg" > "$pkg.sha256"
            ls -l "$pkg" "$pkg.sha256"

      # Files created in the guest workspace are copied back to the host by
      # vmactions (copyback), so they're here for upload / release attach.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rakupp-openbsd-x86_64
          path: rakupp-openbsd-x86_64.tar.gz*
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: rakupp-openbsd-x86_64.tar.gz*
