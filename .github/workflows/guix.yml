name: guix

# Builds the Guix package definition (PR #6: the repo doubles as a Guix
# channel) on an ubuntu runner and smoke-tests the result. Guix only runs on
# Linux and `guix build` compiles rakupp from scratch inside the daemon, so
# this is slower than the normal CI build — the job is therefore path-gated:
# it runs only when the Guix packaging itself (or this workflow) changes, plus
# on demand via workflow_dispatch. The regular build matrix in release.yml
# already covers the C++ side of every push.
#
# pullAfterInstall is off: the Guix release that the installer ships is enough
# to build a plain cmake package, and `guix pull` alone would add ~30 minutes.

on:
  push:
    branches: [main]
    paths:
      - '.guix-channel'
      - '.guix/**'
      - '.github/workflows/guix.yml'
  pull_request:
    branches: [main]
    paths:
      - '.guix-channel'
      - '.guix/**'
      - '.github/workflows/guix.yml'
  workflow_dispatch:

jobs:
  build:
    name: guix build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # A depth-1 clone made guix's git-predicate select NOTHING — the
          # package built from an empty source tree (run 30534305456). A full
          # clone gives libgit2 a normal repository to enumerate; the package
          # definition additionally self-checks the predicate and falls back
          # to copying everything, so either layer alone suffices.
          fetch-depth: 0

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1.6
        with:
          pullAfterInstall: false

      - name: Probe git-predicate (diagnostic)
        # Prints what the source-selection predicate does on this runner's
        # checkout, so a source-selection failure names itself in the log
        # instead of surfacing as "no CMakeLists.txt" three phases later.
        run: |
          guix repl <<'EOF'
          (use-modules (guix git-download))
          (let ((pred (git-predicate (getcwd))))
            (format #t "~%git-predicate: ~a~%"
                    (if pred "returned a predicate" "#f — not recognised as a checkout"))
            (when pred
              (let ((probe (string-append (getcwd) "/CMakeLists.txt")))
                (format #t "predicate accepts CMakeLists.txt: ~a~%"
                        (if (pred probe (lstat probe)) "yes" "NO — enumeration is broken")))))
          EOF

      - name: Build the package
        run: guix build -f .guix/modules/rakupp-package.scm

      - name: Smoke-test the built rakupp
        run: |
          out=$(guix build -f .guix/modules/rakupp-package.scm)   # cached now; prints the store path
          echo "store path: $out"
          "$out/bin/rakupp" --version
          "$out/bin/rakupp" -e 'my %h = a => 1, b => 2; .say for %h.sort; say [+] %h.values'
          test -f "$out/lib/rakupp_rt.a" || test -f "$out/lib/librakupp_rt.a"   # the runtime --exe links against
